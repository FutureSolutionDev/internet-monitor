name: Build & Release

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # ══════════════════════════════════════════════════════════════
  # WEB — React dashboard: typecheck / lint / test / build. The
  # built web/dist is embedded into every Go binary via go:embed.
  # ══════════════════════════════════════════════════════════════
  web:
    name: "🧩 Web UI (typecheck / lint / test / build)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    outputs:
      dev_version: ${{ steps.dev_version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Version for untagged builds
        id: dev_version
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          v=$(tr -d ' \r\n' < ../.release-version 2>/dev/null || true)
          echo "version=v${v:-0.0.0}-dev.${SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          include-hidden-files: true
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════════
  # QUALITY — gofmt / vet / tests (must pass before build/release)
  # ══════════════════════════════════════════════════════════════
  quality:
    name: "✅ Quality (fmt / vet / test)"
    runs-on: ubuntu-22.04
    needs: [web]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: "Install system deps (CGO packages: tray + webview)"
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # Blocking lint over the whole module. The linux pass (GTK installed
      # above) covers the portable packages plus the tray/GUI linux builds; the
      # windows pass covers the windows-only (syscall) files in tray/root/sound.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          golangci-lint run ./...
          GOOS=windows CGO_ENABLED=0 golangci-lint run ./cmd/tray ./internal/...

  # ══════════════════════════════════════════════════════════════
  # VERSION — COMPUTES the next semver (push only) WITHOUT creating
  # the tag (dry_run). Build jobs embed this version; the tag itself
  # is created later by the release job, and only if every build
  # succeeds — so a failed build never burns a version number.
  # ══════════════════════════════════════════════════════════════
  version:
    name: "🏷️ Compute Version (dry-run)"
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read pinned release version
        id: pin
        run: |
          v=$(tr -d ' \r\n' < .release-version 2>/dev/null || true)
          if [ -n "$v" ] && ! git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "custom=$v" >> "$GITHUB_OUTPUT"
          elif [[ "$v" == *-* ]]; then
            echo "::error file=.release-version::v$v is already released. Set .release-version to the next prerelease or to the final version."
            exit 1
          fi

      - name: Compute next version tag (no tag pushed)
        id: tag
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.pin.outputs.custom }}
          default_bump: patch
          release_branches: master,main
          dry_run: true

      - name: Refuse a version below the newest tag
        env:
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          latest=$(git tag -l 'v[0-9]*' | sort -V | tail -1)
          if [ -z "$latest" ]; then
            exit 0
          fi
          new_core=${NEW_TAG%%-*}
          latest_core=${latest%%-*}
          if [ "$(printf '%s\n%s\n' "$latest_core" "$new_core" | sort -V | tail -1)" != "$new_core" ]; then
            echo "::error file=.release-version::$NEW_TAG is below the newest tag $latest. Set .release-version to the next version."
            exit 1
          fi

  # ══════════════════════════════════════════════════════════════
  # BUILD JOBS — all depend on version (if: always() keeps them
  # running on PRs where version job is skipped)
  # ══════════════════════════════════════════════════════════════

  # ── Windows Tray — no CGO, cross-compiled from Linux ─────────
  windows-tray:
    name: "🪟 Windows Tray (cross-compile)"
    runs-on: ubuntu-latest
    needs: [version, quality, web]
    if: ${{ always() && needs.quality.result == 'success' && needs.web.result == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate Windows resources (icon, manifest, version info)
        env:
          VERSION: ${{ needs.version.outputs.new_tag || needs.web.outputs.dev_version }}
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          cd cmd/tray
          go-winres simply --arch amd64 --icon ../../internal/assets/favicon.png \
            --product-version "$VERSION" --file-version "$VERSION" \
            --product-name "Internet Monitor" --file-description "Internet Monitor" \
            --original-filename internet-monitor-windows.exe

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
          VERSION: ${{ needs.version.outputs.new_tag || needs.web.outputs.dev_version }}
        run: go build -ldflags="-H=windowsgui -s -w -X main.Version=$VERSION" -o internet-monitor-windows.exe ./cmd/tray

      - uses: actions/upload-artifact@v7
        with:
          name: windows-tray
          path: internet-monitor-windows.exe

  # ── Windows GUI — CGO + WebView2, requires Windows runner ────
  windows-gui:
    name: "🪟 Windows GUI (native)"
    runs-on: windows-latest
    needs: [version, quality, web]
    if: ${{ always() && needs.quality.result == 'success' && needs.web.result == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate Windows resources (icon, manifest, version info)
        env:
          VERSION: ${{ needs.version.outputs.new_tag || needs.web.outputs.dev_version }}
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          cd cmd/gui
          go-winres simply --arch amd64 --icon ../../internal/assets/favicon.png `
            --product-version "$env:VERSION" --file-version "$env:VERSION" `
            --product-name "Internet Monitor" --file-description "Internet Monitor Dashboard" `
            --original-filename internet-monitor-gui-windows.exe

      - name: Build
        env:
          CGO_ENABLED: 1
          VERSION: ${{ needs.version.outputs.new_tag || needs.web.outputs.dev_version }}
        run: go build -ldflags="-H=windowsgui -s -w -X main.Version=$env:VERSION" -o internet-monitor-gui-windows.exe ./cmd/gui/

      - uses: actions/upload-artifact@v7
        with:
          name: windows-gui
          path: internet-monitor-gui-windows.exe

  # ── macOS — arm64 native + amd64 cross-compiled via Xcode ────
  macos:
    name: "🍎 macOS (arm64 + intel)"
    runs-on: macos-latest
    needs: [version, quality, web]
    if: ${{ always() && needs.quality.result == 'success' && needs.web.result == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build ARM64 (native)
        env:
          CGO_ENABLED: 1
          GOARCH: arm64
          VERSION: ${{ needs.version.outputs.new_tag || needs.web.outputs.dev_version }}
        run: |
          go build -ldflags="-s -w -X main.Version=$VERSION" -o internet-monitor-macos-arm64 ./cmd/tray
          go build -ldflags="-s -w -X main.Version=$VERSION" -o internet-monitor-gui-macos-arm64 ./cmd/gui/

      - name: Build Intel/amd64 (cross-compile via Xcode)
        env:
          CGO_ENABLED: 1
          GOARCH: amd64
          CGO_CFLAGS: "-arch x86_64"
          CGO_LDFLAGS: "-arch x86_64"
          VERSION: ${{ needs.version.outputs.new_tag || needs.web.outputs.dev_version }}
        run: |
          go build -ldflags="-s -w -X main.Version=$VERSION" -o internet-monitor-macos-intel ./cmd/tray
          go build -ldflags="-s -w -X main.Version=$VERSION" -o internet-monitor-gui-macos-intel ./cmd/gui/

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            internet-monitor-macos-arm64
            internet-monitor-macos-intel
            internet-monitor-gui-macos-arm64
            internet-monitor-gui-macos-intel

  # ── Linux — AppIndicator (systray) + WebKitGTK (native GUI) ──
  linux:
    name: "🐧 Linux (ubuntu-22.04)"
    runs-on: ubuntu-22.04
    needs: [version, quality, web]
    if: ${{ always() && needs.quality.result == 'success' && needs.web.result == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev

      - name: Build Tray
        env:
          CGO_ENABLED: 1
          VERSION: ${{ needs.version.outputs.new_tag || needs.web.outputs.dev_version }}
        run: go build -ldflags="-s -w -X main.Version=$VERSION" -o internet-monitor-linux ./cmd/tray

      - name: Build GUI
        env:
          CGO_ENABLED: 1
          VERSION: ${{ needs.version.outputs.new_tag || needs.web.outputs.dev_version }}
        run: go build -ldflags="-s -w -X main.Version=$VERSION" -o internet-monitor-gui-linux ./cmd/gui/

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            internet-monitor-linux
            internet-monitor-gui-linux

  # ══════════════════════════════════════════════════════════════
  # RELEASE — runs only on push to master, AFTER every build passes.
  # It CREATES the tag here (softprops creates tag_name if missing),
  # so the version/tag is only ever minted on a fully green build.
  # No `if: always()` → any failed/skipped build skips this job.
  # ══════════════════════════════════════════════════════════════
  release:
    name: "🚀 Auto Release"
    needs: [version, windows-tray, windows-gui, macos, linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && needs.version.outputs.new_tag != ''
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "{windows-tray,windows-gui,macos,linux}"
          merge-multiple: true
          path: dist/

      - name: Verify every release binary is present
        run: |
          count=$(ls dist/internet-monitor-* | wc -l)
          if [ "$count" -ne 8 ]; then
            echo "Expected 8 binaries, found $count:"; ls -la dist; exit 1
          fi

      - name: Make Linux/macOS binaries executable
        run: |
          chmod +x \
            dist/internet-monitor-linux \
            dist/internet-monitor-gui-linux \
            dist/internet-monitor-macos-* \
            dist/internet-monitor-gui-macos-* \
            2>/dev/null || true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum internet-monitor-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.new_tag }}
          target_commitish: ${{ github.sha }}
          name: "Internet Monitor ${{ needs.version.outputs.new_tag }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.version.outputs.new_tag, '-') }}
          make_latest: ${{ !contains(needs.version.outputs.new_tag, '-') }}
          files: |
            dist/internet-monitor-windows.exe
            dist/internet-monitor-gui-windows.exe
            dist/internet-monitor-macos-intel
            dist/internet-monitor-macos-arm64
            dist/internet-monitor-gui-macos-intel
            dist/internet-monitor-gui-macos-arm64
            dist/internet-monitor-linux
            dist/internet-monitor-gui-linux
            dist/SHA256SUMS
          body: |
            ## Internet Monitor ${{ needs.version.outputs.new_tag }}

            ### Download the right file for your OS

            | File | OS | Mode |
            | ---- | -- | ---- |
            | `internet-monitor-windows.exe` | Windows 10/11 | System Tray |
            | `internet-monitor-gui-windows.exe` | Windows 10/11 | Standalone window |
            | `internet-monitor-macos-arm64` | macOS M1/M2/M3 | System Tray |
            | `internet-monitor-macos-intel` | macOS Intel | System Tray |
            | `internet-monitor-gui-macos-arm64` | macOS M1/M2/M3 | Standalone window |
            | `internet-monitor-gui-macos-intel` | macOS Intel | Standalone window |
            | `internet-monitor-linux` | Linux | System Tray |
            | `internet-monitor-gui-linux` | Linux | Standalone window |

            > Download the binary only — `config.json` is created automatically on first run.

            ---

